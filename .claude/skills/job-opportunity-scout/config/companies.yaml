# Target companies and where their jobs are published.
#
#   name:      display name (also used to match aggregator results)
#   ats:       greenhouse | lever | ashby | smartrecruiters | workable | recruitee | personio | teamtailor | workday | browser
#   id:        board token / account slug / Workday tenant
#   wd, site:  Workday only (from https://{id}.{wd}.myworkdayjobs.com/{site})
#   region:    lever only, "eu" for api.eu.lever.co
#   bucket:    A = Fortune 500 / Global 500, B = tech start-up / scale-up
#   industry:  free text, helps scoring
#   enabled:   false to switch an entry off without deleting it
#
# Add companies with:  python3 scripts/discover.py "Company" --bucket B --industry SaaS --add
# Test all entries:    python3 scripts/discover.py --check
# HPE and HPE-owned brands (Aruba, Juniper, Morpheus, OpsRamp, Zerto) are excluded on purpose.

